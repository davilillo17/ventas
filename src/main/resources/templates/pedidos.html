<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedidos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <h1 class="h2 mb-0">Pedidos</h1>
        <a class="btn btn-primary" th:href="@{/pedidos/crear}">Crear pedido</a>
    </div>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark"><tr><th>ID</th><th>Total</th><th>Fecha</th><th>Cliente</th><th>Comercial</th><th>Acciones</th></tr></thead>
            <tbody>
            <tr th:each="pedido : ${pedidos}">
                <td th:text="${pedido.id}">0</td>
                <td th:text="${#numbers.formatDecimal(pedido.total, 1, 2)} + ' €'">0,00 €</td>
                <td th:text="${pedido.fecha != null ? #temporals.format(pedido.fecha, 'dd/MM/yyyy') : '-'}">-</td>
                <td th:text="${pedido.clienteNombre}">Cliente</td>
                <td th:text="${pedido.comercialNombre}">Comercial</td>
                <td><div class="d-flex flex-wrap gap-2">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/pedidos/{id}(id=${pedido.id})}">Ver detalle</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/pedidos/editar/{id}(id=${pedido.id})}">Editar</a>
                    <form th:action="@{/pedidos/borrar/{id}(id=${pedido.id})}" method="post" onsubmit="return confirm('¿Eliminar este pedido?')"><button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button></form>
                </div></td>
            </tr>
            <tr th:if="${#lists.isEmpty(pedidos)}"><td colspan="6" class="text-center text-muted">No hay pedidos registrados.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
